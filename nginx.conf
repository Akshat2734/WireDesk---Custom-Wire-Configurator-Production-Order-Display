events {
    worker_connections 1024;
}

http {
    # Define the Load Balancer group
    upstream flask_api {
        ip_hash;
        # These names match the docker-compose service names
        server api_node_1:5000;
        server api_node_2:5000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://flask_api;
            
            # Standard Proxy Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # CRITICAL: WebSocket Upgrade Headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            # Prevent NGINX from dropping long-running WebSocket connections
            proxy_read_timeout 86400;
        }
    }
}
